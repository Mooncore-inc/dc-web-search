[project]
name = "dc-web-search"
version = "0.1.0"
description = "Web search module for demon-cry"
authors = [
    {name = "mooncore-inc"}
]
license = "Apache2"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "demon-cry-base (>=0.1.0,<0.2.0)",
    "httpx"
]


[project.entry-points."demon_cry.modules"]
web_search = "dc_web_search:WebSearch"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
